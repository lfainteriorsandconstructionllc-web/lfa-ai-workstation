# LFA AI Workstation — Optimización de kernel para trabajo multi-agente en la nube
# Límites altos de watchers para múltiples IDEs, agentes y servidores MCP simultáneos
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 4096
fs.inotify.max_user_queued_events = 65536

# Mayor límite de mapas de memoria para Electron / Node / JVM / Rust / Docker
vm.max_map_count = 1048576

# Gestión de memoria óptima con zram (zstd en RAM)
vm.swappiness = 80
vm.page-cluster = 0
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# Red de baja latencia para APIs y agentes en la nube
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
